name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The critical signal: evaluate every flake output (catches module-option
  # typos and niri-settings schema errors) without building anything.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate flake (no build)
        run: nix flake check --no-build --all-systems

  # Style + hygiene. Kept separate so a formatting nit doesn't hide the eval
  # result (and vice versa).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Formatting (alejandra)
        run: nix run nixpkgs#alejandra -- --check .
      - name: Lint (statix)
        run: nix run nixpkgs#statix -- check .
      - name: Dead code (deadnix)
        run: nix run nixpkgs#deadnix -- --fail .

  # Realise the NixOS system. Noctalia comes from Cachix; Niri and other
  # system packages use nixpkgs' binary cache when available. Runs on main / manual dispatch.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Use the Noctalia binary cache; Niri comes from nixpkgs.
          extra-conf: |
            extra-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - name: Build the NixOS system closure
        run: |
          nix build --print-build-logs \
            '.#nixosConfigurations.nnn.config.system.build.toplevel'
